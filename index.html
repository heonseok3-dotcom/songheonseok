<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모바일 신분증 본인인증 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Pretendard', sans-serif; }
        .auth-card { max-width: 450px; margin: 50px auto; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .user-photo { width: 150px; height: 180px; object-fit: cover; border-radius: 10px; border: 2px solid #ddd; }
        .status-badge { font-size: 1.1rem; padding: 10px; border-radius: 50px; }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-card card">
        <div class="card-header bg-dark text-white text-center py-3">
            <h4>디지털 신분증 인증</h4>
        </div>
        <div class="card-body text-center">
            <div class="mb-4">
                <input type="text" id="qrInput" class="form-control mb-2" placeholder="QR 코드를 스캔하거나 번호를 입력하세요">
                <button class="btn btn-primary w-100" onclick="verifyID()">본인 인증 요청</button>
            </div>

            <div id="resultArea" style="display: none;">
                <hr>
                <div id="statusMsg" class="status-badge mb-3"></div>
                <div id="userInfo" style="display: none;">
                    <img id="userPhoto" src="" class="user-photo mb-3" alt="사용자 사진">
                    <h3 id="userName" class="fw-bold"></h3>
                    <p id="userBirth" class="text-muted"></p>
                    <p id="userDept" class="badge bg-secondary"></p>
                    <div class="text-start mt-3 small text-muted text-center">
                        인증 시간: <span id="authTime"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function verifyID() {
        const qrId = document.getElementById('qrInput').value;
        const resultArea = document.getElementById('resultArea');
        const userInfo = document.getElementById('userInfo');
        const statusMsg = document.getElementById('statusMsg');

        const response = await fetch('/verify', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({qr_id: qrId})
        });

        const data = await response.json();
        resultArea.style.display = 'block';

        if (data.status === 'success') {
            statusMsg.innerText = "✅ " + data.message;
            statusMsg.className = "status-badge bg-success-subtle text-success";
            
            // 사용자 정보 채우기
            userInfo.style.display = 'block';
            document.getElementById('userName').innerText = data.user.name;
            document.getElementById('userBirth').innerText = "생년월일: " + data.user.birth;
            document.getElementById('userDept').innerText = data.user.dept;
            document.getElementById('authTime').innerText = data.time;
            // 사진 경로 설정 (static/images/ 폴더에 사진이 있어야 함)
            document.getElementById('userPhoto').src = "/static/images/" + data.user.photo;
        } else {
            statusMsg.innerText = "❌ " + data.message;
            statusMsg.className = "status-badge bg-danger-subtle text-danger";
            userInfo.style.display = 'none';
        }
    }
</script>
</body>
</html>
